plugins { id 'com.android.application' }
android {
    namespace 'org.megarun'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'org.megarun.player'
        minSdk 24            // Android 7.0
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_ARM_NEON=TRUE'; cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt' } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
