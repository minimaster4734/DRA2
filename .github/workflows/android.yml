name: android-apk
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK/NDK packages (runner's preinstalled SDK)
        run: |
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Fetch SDL2 and link its Java glue
        run: ./android/fetch_sdl.sh
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: dra2-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
